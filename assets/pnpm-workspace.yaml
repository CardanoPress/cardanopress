# pnpm 10+ reads project settings here (the package.json "pnpm" field is ignored).
# Force build-only transitive packages to patched releases:
#   uuid    - GHSA-w5hq-g745-h8pq
#   esbuild - GHSA-gv7w-rqvm-qjhr (high) and GHSA-g7r4-m6w7-qqqr (low)
#   postcss - GHSA-6g55-p6wh-862q follow-up and source map path traversal
#   nanoid  - non-secure and custom generator infinite loops
# Hold @swc/core: newer releases break vite-plugin-top-level-await 1.6.0 ("missing field `type`").
overrides:
  uuid: ^11.1.1
  esbuild: ^0.28.1
  postcss: ^8.5.23
  nanoid: ^3.3.18
  '@swc/core': 1.15.33

# Allow these well-known build tools to run their install scripts.
allowBuilds:
  '@swc/core': true
  esbuild: true
